# Review existing database schema and run/stamp Alembic manually before enabling deploys.
# This Blueprint does not provision or modify the supplied Render PostgreSQL database.
services:
  - type: web
    name: school-erp-saas-preview
    runtime: docker
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SAAS_RAZORPAY_KEY_ID
        sync: false
      - key: SAAS_RAZORPAY_KEY_SECRET
        sync: false
      - key: SAAS_RAZORPAY_WEBHOOK_SECRET
        sync: false
  - type: cron
    name: school-erp-subscription-reconciliation
    runtime: docker
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m scripts.reconcile_subscriptions
    schedule: '10 0 * * *'
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OBJECT_STORAGE_BUCKET
        sync: false
