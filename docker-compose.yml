services:
  school-erp:
    build:
      context: .
      dockerfile: Dockerfile
    image: school-college-erp:latest
    container_name: school_college_erp_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=School/College ERP Platform
      - API_V1_STR=/api
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in the environment}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
      - DATABASE_URL=sqlite:////app/backend/data/school_erp.db
    volumes:
      - erp_db_data:/app/backend/data
      - erp_uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  erp_db_data:
  erp_uploads_data:
