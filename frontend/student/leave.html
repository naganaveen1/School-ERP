<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Leave - Student Portal</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Student Leave Applications</h2>
            <div class="page-subtitle">Submit absence requests for approval and monitor application status</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#applyLeaveModal">
              + Apply for Leave
            </button>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Leave Type</th>
                <th>Absence Duration</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Faculty / Principal Remarks</th>
                <th>Applied Date</th>
              </tr>
            </thead>
            <tbody id="student-leaves-tbody">
              <tr><td colspan="6" class="text-center py-4 text-muted">Loading your leave history...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Apply Modal -->
        <div class="modal fade" id="applyLeaveModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="student-leave-form" onsubmit="applyLeave(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Submit Absence Request</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Leave Type *</label>
                    <select name="leave_type" class="form-select" required>
                      <option value="Medical / Sick Leave">Medical / Sick Leave</option>
                      <option value="Family / Personal">Family / Personal</option>
                      <option value="Academic Competition / Sports">Academic Competition / Sports</option>
                    </select>
                  </div>
                  <div class="row g-2 mb-3">
                    <div class="col-md-6">
                      <label class="form-label">Start Date *</label>
                      <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">End Date *</label>
                      <input type="date" name="end_date" class="form-control" required>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Reason for Absence *</label>
                    <textarea name="reason" class="form-control" rows="3" required placeholder="Explain reason for requested leave..."></textarea>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Submit Application</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    if (permissions.enforcePageAccess(['STUDENT'])) {
      components.renderLayout('Apply Leave');
      loadMyLeaves();
    }

    async function loadMyLeaves() {
      const tbody = document.getElementById('student-leaves-tbody');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Loading your leave history...</td></tr>';

      try {
        const leaves = await api.get('/leave/my');
        if (!leaves || leaves.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="table-empty-state">No leave applications on file.</td></tr>';
          return;
        }

        tbody.innerHTML = leaves.map(l => `
          <tr>
            <td><strong>${l.leave_type}</strong></td>
            <td>${utils.formatDate(l.start_date)} &rarr; ${utils.formatDate(l.end_date)}</td>
            <td>${l.reason}</td>
            <td>${utils.getStatusBadge(l.status)}</td>
            <td class="small text-muted">${l.remarks || '—'}</td>
            <td class="small text-muted">${utils.formatDate(l.created_at)}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-danger py-4 text-center">${e.message}</td></tr>`;
      }
    }

    async function applyLeave(e) {
      e.preventDefault();
      const form = document.getElementById('student-leave-form');
      const payload = {
        leave_type: form.leave_type.value,
        start_date: form.start_date.value,
        end_date: form.end_date.value,
        reason: form.reason.value.trim()
      };

      try {
        await api.post('/leave', payload);
        utils.showToast('Leave request submitted successfully!', 'success');
        form.reset();
        bootstrap.Modal.getInstance(document.getElementById('applyLeaveModal')).hide();
        loadMyLeaves();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
