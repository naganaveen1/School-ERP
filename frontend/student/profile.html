<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - Student Portal</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title" id="prof-name">Student Profile</h2>
            <div class="page-subtitle" id="prof-class">Class &amp; Enrollment Information</div>
          </div>
          <div>
            <span class="badge bg-primary px-3 py-2 fs-6" id="prof-adm">ADM</span>
          </div>
        </div>

        <div class="row g-4">
          <!-- Academic & Registration Profile -->
          <div class="col-lg-6">
            <div class="card card-custom h-100 p-4">
              <h5 class="fw-bold mb-3 border-bottom pb-2">Academic Registration</h5>
              <table class="table table-borderless">
                <tbody>
                  <tr>
                    <th class="text-muted w-40">Roll Number:</th>
                    <td id="prof-roll">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Gender:</th>
                    <td id="prof-gender">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Blood Group:</th>
                    <td id="prof-blood">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Date of Birth:</th>
                    <td id="prof-dob">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Parent / Guardian:</th>
                    <td id="prof-parent" class="fw-bold">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Emergency Phone:</th>
                    <td id="prof-emergency">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Official Email:</th>
                    <td id="prof-email">—</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Editable Details & Password -->
          <div class="col-lg-6">
            <div class="card card-custom p-4 mb-4">
              <h5 class="fw-bold mb-3 border-bottom pb-2">Update Contact Information</h5>
              <form id="update-profile-form" onsubmit="updateContact(event)">
                <div class="mb-3">
                  <label class="form-label">Contact Phone</label>
                  <input type="text" id="prof-edit-phone" class="form-control" placeholder="+1-555-0100">
                </div>
                <div class="mb-3">
                  <label class="form-label">Residential Address</label>
                  <textarea id="prof-edit-address" class="form-control" rows="2" placeholder="Full residential street address"></textarea>
                </div>
                <button type="submit" class="btn btn-outline-primary w-100">Save Contact Details</button>
              </form>
            </div>

            <div class="card card-custom p-4">
              <h5 class="fw-bold mb-3 border-bottom pb-2">Change Password</h5>
              <form id="change-pass-form" onsubmit="changePassword(event)">
                <div class="mb-3">
                  <label class="form-label">Current Password *</label>
                  <input type="password" name="old_password" class="form-control" required placeholder="Current password">
                </div>
                <div class="mb-3">
                  <label class="form-label">New Password *</label>
                  <input type="password" name="new_password" class="form-control" required minlength="6" placeholder="Min 6 characters">
                </div>
                <button type="submit" class="btn btn-primary w-100">Update Password</button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    if (permissions.enforcePageAccess(['STUDENT'])) {
      components.renderLayout('My Profile');
      loadProfile();
    }

    async function loadProfile() {
      try {
        const p = await api.get('/student/profile');
        const setText = (id, val) => {
          const el = document.getElementById(id);
          if (el) el.textContent = val || '—';
        };

        setText('prof-name', p.full_name);
        setText('prof-class', `${p.class_name || ''} ${p.section_name ? `(${p.section_name})` : ''} • Enrolled Student`);
        setText('prof-adm', p.admission_number);
        setText('prof-roll', p.roll_number);
        setText('prof-gender', p.gender);
        setText('prof-blood', p.blood_group);
        setText('prof-dob', utils.formatDate(p.date_of_birth));
        setText('prof-parent', p.parent_name);
        setText('prof-emergency', p.emergency_contact);
        setText('prof-email', p.email);

        document.getElementById('prof-edit-phone').value = p.phone || '';
        document.getElementById('prof-edit-address').value = p.address || '';
      } catch (e) {
        console.error(e);
      }
    }

    async function updateContact(e) {
      e.preventDefault();
      const phone = document.getElementById('prof-edit-phone').value.trim();
      const address = document.getElementById('prof-edit-address').value.trim();

      try {
        await api.put('/student/profile', { phone, address });
        utils.showToast('Contact details updated successfully!', 'success');
        loadProfile();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    async function changePassword(e) {
      e.preventDefault();
      const form = document.getElementById('change-pass-form');
      const old_password = form.old_password.value;
      const new_password = form.new_password.value;

      try {
        await api.post('/auth/change-password', { old_password, new_password });
        utils.showToast('Password updated successfully!', 'success');
        form.reset();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
