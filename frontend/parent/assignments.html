<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child Assignments - Parent Portal</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Child Coursework &amp; Assignments</h2>
            <div class="page-subtitle">Track homework assignments, due dates, submission progress, and teacher grading</div>
          </div>
          <div>
            <select id="child-select" class="form-select" onchange="loadChildAssignments()">
              <option value="">Select Child</option>
            </select>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Assignment Title</th>
                <th>Subject</th>
                <th>Due Date</th>
                <th>Submission Status</th>
                <th>Marks Scored</th>
              </tr>
            </thead>
            <tbody id="child-assignments-tbody">
              <tr><td colspan="5" class="text-center py-4 text-muted">Select a child to view assignments...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    if (permissions.enforcePageAccess(['PARENT'])) {
      components.renderLayout('Assignments');
      initPage();
    }

    async function initPage() {
      try {
        const children = await api.get('/parent/children');
        const sel = document.getElementById('child-select');
        if (!children || children.length === 0) {
          sel.innerHTML = '<option value="">No linked children</option>';
          return;
        }

        const params = utils.getQueryParams();
        const activeId = params.child_id ? parseInt(params.child_id) : children[0].id;

        sel.innerHTML = children.map(c => `
          <option value="${c.id}" ${c.id === activeId ? 'selected' : ''}>${c.name} (${c.class_name})</option>
        `).join('');

        loadChildAssignments();
      } catch (e) {
        console.error(e);
      }
    }

    async function loadChildAssignments() {
      const childId = document.getElementById('child-select').value;
      if (!childId) return;

      const tbody = document.getElementById('child-assignments-tbody');
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Loading assignments...</td></tr>';

      try {
        const list = await api.get(`/parent/child/${childId}/assignments`);
        if (!list || list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="table-empty-state">No assignments found for this child\'s class.</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(a => `
          <tr>
            <td><strong>${a.title}</strong></td>
            <td>${a.subject_name}</td>
            <td>${utils.formatDate(a.due_date)}</td>
            <td>${a.submitted ? utils.getStatusBadge(a.submission_status) : '<span class="badge bg-warning text-dark">Pending</span>'}</td>
            <td>${a.marks_obtained !== null && a.marks_obtained !== undefined ? `<strong class="text-success">${a.marks_obtained} / ${a.max_marks}</strong>` : '<span class="text-muted">—</span>'}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger py-4 text-center">${e.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
