<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Parent Portal</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Internal Communications &amp; Messages</h2>
            <div class="page-subtitle">Communicate with class teachers, faculty instructors, and administration</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#composeModal">
              ✉️ Compose Message
            </button>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs mb-4" id="messagesTab" role="tablist">
          <li class="nav-item">
            <button class="nav-link active fw-bold" onclick="messagesManager.loadMessages('inbox')">
              📥 Inbox Messages
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link fw-bold" onclick="messagesManager.loadMessages('sent')">
              📤 Sent Outbox
            </button>
          </li>
        </ul>

        <div id="messages-list-container">
          <div class="text-center py-4 text-muted">Loading messages...</div>
        </div>

        <!-- Compose Modal -->
        <div class="modal fade" id="composeModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="compose-message-form" onsubmit="messagesManager.sendMessage(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Compose Internal Message</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Recipient (Teacher / Staff) *</label>
                    <select name="receiver_id" id="compose-recipient" class="form-select" required>
                      <option value="">Select Recipient</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Subject *</label>
                    <input type="text" name="subject" class="form-control" required placeholder="e.g. Inquiry regarding science lab assignment">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Message Content *</label>
                    <textarea name="body" class="form-control" rows="5" required placeholder="Type your message to staff here..."></textarea>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Send Message</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script src="/frontend/js/messages.js"></script>
  <script>
    if (permissions.enforcePageAccess(['PARENT'])) {
      components.renderLayout('Messages');
      messagesManager.init();
    }
  </script>
</body>
</html>
