<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Details - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <div class="mb-1"><a href="/frontend/admin/teachers.html" class="text-decoration-none small">&larr; Back to Faculty List</a></div>
            <h2 class="page-title" id="detail-name">Faculty Profile</h2>
            <div class="page-subtitle" id="detail-designation">Designation</div>
          </div>
          <div>
            <span class="badge bg-secondary px-3 py-2 fs-6" id="detail-dept">Department</span>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <div class="card card-custom h-100 p-4">
              <h5 class="fw-bold mb-3 border-bottom pb-2">Professional &amp; Contact Information</h5>
              <table class="table table-borderless">
                <tbody>
                  <tr>
                    <th class="text-muted w-40">Employee ID:</th>
                    <td id="detail-empid" class="fw-bold">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Qualification:</th>
                    <td id="detail-qual">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Email Address:</th>
                    <td id="detail-email">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Phone Number:</th>
                    <td id="detail-phone">—</td>
                  </tr>
                  <tr>
                    <th class="text-muted">Residential Address:</th>
                    <td id="detail-address">—</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="col-md-6">
            <div class="card card-custom h-100 p-4">
              <h5 class="fw-bold mb-3 border-bottom pb-2">Assigned Teaching Subjects</h5>
              <ul class="list-group list-group-flush" id="teacher-subjects-list">
                <li class="list-group-item text-muted">Loading assigned subjects...</li>
              </ul>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script src="/frontend/js/teachers.js"></script>
  <script>
    if (permissions.enforcePageAccess(['SCHOOL_ADMIN', 'PRINCIPAL'])) {
      components.renderLayout('Faculty Details');
      teachersManager.loadTeacherDetails();
    }
  </script>
</body>
</html>
