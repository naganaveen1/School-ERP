<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sections &amp; Classrooms - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Sections &amp; Classrooms</h2>
            <div class="page-subtitle">Configure class sections, room allocations, and assigned class teachers</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSectionModal">
              + New Section
            </button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-10">
              <select id="filter-class" class="form-select" onchange="loadSections()">
                <option value="">All Classes</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="loadSections()">Refresh</button>
            </div>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Section</th>
                <th>Class</th>
                <th>Room Number</th>
                <th>Assigned Class Teacher</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="sections-tbody">
              <tr><td colspan="6" class="text-center py-4 text-muted">Loading sections...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Add Section Modal -->
        <div class="modal fade" id="addSectionModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="add-section-form" onsubmit="createSection(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Create Class Section</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Parent Class *</label>
                    <select name="class_id" id="modal-class-select" class="form-select" required>
                      <option value="">Select Class</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Section Name *</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. Section A">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Room Number</label>
                    <input type="text" name="room_number" class="form-control" placeholder="e.g. Room 102">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Class Teacher (Optional)</label>
                    <select name="class_teacher_id" id="modal-teacher-select" class="form-select">
                      <option value="">Unassigned</option>
                    </select>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Create Section</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    let allClasses = [];

    if (permissions.enforcePageAccess(['SCHOOL_ADMIN'])) {
      components.renderLayout('Sections');
      initPage();
    }

    async function initPage() {
      await loadFilterAndTeachers();
      await loadSections();
    }

    async function loadFilterAndTeachers() {
      try {
        const [classes, teachersRes] = await Promise.all([
          api.get('/classes'),
          api.get('/teachers', { page_size: 100 })
        ]);
        allClasses = classes;

        const filterCls = document.getElementById('filter-class');
        const modalCls = document.getElementById('modal-class-select');
        const modalTchr = document.getElementById('modal-teacher-select');

        if (filterCls) {
          filterCls.innerHTML = '<option value="">All Classes</option>' +
            classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
        if (modalCls) {
          modalCls.innerHTML = '<option value="">Select Class</option>' +
            classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
        if (modalTchr && teachersRes.items) {
          modalTchr.innerHTML = '<option value="">Unassigned</option>' +
            teachersRes.items.map(t => `<option value="${t.id}">${t.user ? t.user.full_name : ''} (${t.employee_id})</option>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadSections() {
      const selectedClassId = document.getElementById('filter-class').value;
      const tbody = document.getElementById('sections-tbody');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Loading sections...</td></tr>';

      try {
        let sectionsList = [];
        if (selectedClassId) {
          sectionsList = await api.get(`/classes/${selectedClassId}/sections`);
        } else {
          // Flatten from allClasses
          const classes = await api.get('/classes');
          allClasses = classes;
          classes.forEach(c => {
            (c.sections || []).forEach(s => {
              sectionsList.push(s);
            });
          });
        }

        if (sectionsList.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="table-empty-state">No sections found.</td></tr>';
          return;
        }

        tbody.innerHTML = sectionsList.map(s => `
          <tr>
            <td><strong>${s.name}</strong></td>
            <td>${s.class_name || '—'}</td>
            <td>${s.room_number || '—'}</td>
            <td>${s.class_teacher_name || '<span class="text-muted">Unassigned</span>'}</td>
            <td>${utils.formatDate(s.created_at)}</td>
            <td>
              <button class="table-action-btn text-danger" onclick="deleteSection(${s.id})" title="Delete">🗑️</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-danger py-4 text-center">${e.message}</td></tr>`;
      }
    }

    async function createSection(e) {
      e.preventDefault();
      const form = document.getElementById('add-section-form');
      const classId = form.class_id.value;
      const payload = {
        name: form.name.value.trim(),
        room_number: form.room_number.value.trim() || null,
        class_teacher_id: parseInt(form.class_teacher_id.value) || null
      };

      try {
        await api.post(`/classes/${classId}/sections`, payload);
        utils.showToast('Section created successfully!', 'success');
        form.reset();
        bootstrap.Modal.getInstance(document.getElementById('addSectionModal')).hide();
        loadSections();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    async function deleteSection(id) {
      if (!confirm('Are you sure you want to delete this section?')) return;
      try {
        await api.delete(`/classes/sections/${id}`);
        utils.showToast('Section deleted successfully', 'success');
        loadSections();
      } catch (e) {
        utils.showToast(e.message, 'danger');
      }
    }
  </script>
</body>
</html>
