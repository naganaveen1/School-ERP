<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notices &amp; Announcements - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Notices &amp; Announcements</h2>
            <div class="page-subtitle">Publish circulars, announcements, and institutional broadcasts</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createNoticeModal">
              + Post New Notice
            </button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-10">
              <select id="filter-target-role" class="form-select" onchange="loadNotices()">
                <option value="">All Audiences</option>
                <option value="ALL">Everyone (ALL)</option>
                <option value="TEACHER">Faculty Only (TEACHER)</option>
                <option value="STUDENT">Students Only (STUDENT)</option>
                <option value="PARENT">Parents Only (PARENT)</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="loadNotices()">Refresh</button>
            </div>
          </div>
        </div>

        <!-- Notices Container -->
        <div id="notices-container" class="row g-3">
          <div class="col-12 text-center py-4 text-muted">Loading notices...</div>
        </div>

        <!-- Post Notice Modal -->
        <div class="modal fade" id="createNoticeModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <form id="create-notice-form" onsubmit="createNotice(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Post New Notice</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Notice Title *</label>
                    <input type="text" name="title" class="form-control" required placeholder="e.g. Annual Sports Meet 2026 Registration">
                  </div>
                  <div class="row g-3 mb-3">
                    <div class="col-md-6">
                      <label class="form-label">Target Audience *</label>
                      <select name="target_role" class="form-select" required>
                        <option value="ALL">Everyone (Public Broadcast)</option>
                        <option value="TEACHER">Faculty Members</option>
                        <option value="STUDENT">Students</option>
                        <option value="PARENT">Parents &amp; Guardians</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Expiration Date (Optional)</label>
                      <input type="date" name="expires_at" class="form-control">
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Notice Content *</label>
                    <textarea name="content" class="form-control" rows="5" required placeholder="Write the announcement body here..."></textarea>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_published" id="is_published" checked>
                    <label class="form-check-label" for="is_published">
                      Publish immediately to target audience
                    </label>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Publish Notice</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    if (permissions.enforcePageAccess(['SCHOOL_ADMIN', 'PRINCIPAL'])) {
      components.renderLayout('Notices & Announcements');
      loadNotices();
    }

    async function loadNotices() {
      const container = document.getElementById('notices-container');
      const targetRole = document.getElementById('filter-target-role').value;
      container.innerHTML = '<div class="col-12 text-center py-4 text-muted">Loading notices...</div>';

      try {
        const params = {};
        if (targetRole) params.target_role = targetRole;
        const notices = await api.get('/notices', params);

        if (!notices || notices.length === 0) {
          container.innerHTML = '<div class="col-12 text-center py-5 text-muted">No notices found.</div>';
          return;
        }

        container.innerHTML = notices.map(n => `
          <div class="col-md-6 mb-3">
            <div class="card card-custom h-100 p-3">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="fw-bold mb-0 text-dark">${n.title}</h5>
                <span class="badge ${n.target_role === 'ALL' ? 'bg-primary' : 'bg-secondary'}">${n.target_role}</span>
              </div>
              <p class="text-secondary small mb-3" style="white-space: pre-wrap;">${n.content}</p>
              <div class="d-flex justify-content-between align-items-center pt-2 border-top small text-muted">
                <div>
                  By: <strong>${n.publisher_name || 'Admin'}</strong> &bull; ${utils.formatDate(n.publish_date)}
                </div>
                <div>
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteNotice(${n.id})">Delete</button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<div class="col-12 text-danger text-center py-4">${e.message}</div>`;
      }
    }

    async function createNotice(e) {
      e.preventDefault();
      const form = document.getElementById('create-notice-form');
      const payload = {
        title: form.title.value.trim(),
        content: form.content.value.trim(),
        target_role: form.target_role.value,
        expires_at: form.expires_at.value || null,
        is_published: form.is_published.checked
      };

      try {
        await api.post('/notices', payload);
        utils.showToast('Notice published successfully!', 'success');
        form.reset();
        form.is_published.checked = true;
        bootstrap.Modal.getInstance(document.getElementById('createNoticeModal')).hide();
        loadNotices();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    async function deleteNotice(id) {
      if (!confirm('Are you sure you want to delete this notice?')) return;
      try {
        await api.delete(`/notices/${id}`);
        utils.showToast('Notice deleted', 'success');
        loadNotices();
      } catch (e) {
        utils.showToast(e.message, 'danger');
      }
    }
  </script>
</body>
</html>
