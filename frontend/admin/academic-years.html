<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Years - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Academic Years</h2>
            <div class="page-subtitle">Configure academic calendar sessions, terms, and current active session</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addYearModal">
              + New Academic Year
            </button>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Session Name</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="academic-years-tbody">
              <tr><td colspan="5" class="text-center py-4 text-muted">Loading academic years...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Add Modal -->
        <div class="modal fade" id="addYearModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="add-year-form" onsubmit="createAcademicYear(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Add Academic Session</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Session Name *</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. 2026-2027">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Start Date *</label>
                    <input type="date" name="start_date" class="form-control" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">End Date *</label>
                    <input type="date" name="end_date" class="form-control" required>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_current" id="is_current">
                    <label class="form-check-label" for="is_current">
                      Set as current active academic session
                    </label>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Save Session</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    if (permissions.enforcePageAccess(['SCHOOL_ADMIN'])) {
      components.renderLayout('Academic Years');
      loadAcademicYears();
    }

    async function loadAcademicYears() {
      const tbody = document.getElementById('academic-years-tbody');
      try {
        const years = await api.get('/classes/academic-years');
        if (!years || years.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="table-empty-state">No academic sessions found.</td></tr>';
          return;
        }

        tbody.innerHTML = years.map(y => `
          <tr>
            <td><strong>${y.name}</strong></td>
            <td>${utils.formatDate(y.start_date)}</td>
            <td>${utils.formatDate(y.end_date)}</td>
            <td>
              ${y.is_current ? '<span class="badge bg-success">Active Session</span>' : '<span class="badge bg-secondary">Archived</span>'}
            </td>
            <td>
              ${!y.is_current ? `<button class="btn btn-sm btn-outline-primary" onclick="setCurrentYear(${y.id})">Set Active</button>` : '<span class="text-muted small">Current</span>'}
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger py-4 text-center">${e.message}</td></tr>`;
      }
    }

    async function createAcademicYear(e) {
      e.preventDefault();
      const form = document.getElementById('add-year-form');
      const payload = {
        name: form.name.value.trim(),
        start_date: form.start_date.value,
        end_date: form.end_date.value,
        is_current: form.is_current.checked
      };

      try {
        await api.post('/classes/academic-years', payload);
        utils.showToast('Academic year created successfully!', 'success');
        form.reset();
        bootstrap.Modal.getInstance(document.getElementById('addYearModal')).hide();
        loadAcademicYears();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    async function setCurrentYear(id) {
      try {
        await api.patch(`/classes/academic-years/${id}/set-current`, {});
        utils.showToast('Current academic year updated', 'success');
        loadAcademicYears();
      } catch (e) {
        utils.showToast(e.message, 'danger');
      }
    }
  </script>
</body>
</html>
