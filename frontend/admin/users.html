<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Accounts - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">User Accounts</h2>
            <div class="page-subtitle">Manage system users, login credentials, and assigned roles</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
              + Add User
            </button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-6">
              <input type="text" id="user-search" class="form-control" placeholder="Search by name, username, or email...">
            </div>
            <div class="col-md-4">
              <select id="user-role-filter" class="form-select">
                <option value="">All Roles</option>
                <option value="SCHOOL_ADMIN">ADMIN</option>
                <option value="PRINCIPAL">PRINCIPAL</option>
                <option value="TEACHER">TEACHER</option>
                <option value="STUDENT">STUDENT</option>
                <option value="PARENT">PARENT</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="loadUsers(1)">Refresh</button>
            </div>
          </div>
        </div>

        <!-- Users Table -->
        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Username</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr><td colspan="7" class="text-center py-4 text-muted">Loading users...</td></tr>
            </tbody>
          </table>
        </div>

        <div id="pagination-container" class="mt-3"></div>

        <!-- Add User Modal -->
        <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="add-user-form" onsubmit="createUser(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Create New User Account</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="e.g. jdoe">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" class="form-control" required placeholder="e.g. John Doe">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="e.g. jdoe@example.com">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required minlength="6" placeholder="Minimum 6 characters">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select" required>
                      <option value="SCHOOL_ADMIN">ADMIN</option>
                      <option value="PRINCIPAL">PRINCIPAL</option>
                      <option value="TEACHER">TEACHER</option>
                      <option value="STUDENT">STUDENT</option>
                      <option value="PARENT">PARENT</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Phone (Optional)</label>
                    <input type="text" name="phone" class="form-control" placeholder="+1-555-0100">
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Create User</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    let curPage = 1;
    let search = '';
    let role = '';

    if (permissions.enforcePageAccess(['SCHOOL_ADMIN'])) {
      components.renderLayout('User Accounts');
      loadUsers(1);

      document.getElementById('user-search').addEventListener('input', utils.debounce(e => {
        search = e.target.value.trim();
        loadUsers(1);
      }, 350));

      document.getElementById('user-role-filter').addEventListener('change', e => {
        role = e.target.value;
        loadUsers(1);
      });
    }

    async function loadUsers(page = 1) {
      curPage = page;
      const tbody = document.getElementById('users-table-body');
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Loading users...</td></tr>';
      try {
        const res = await api.get('/users', { page: curPage, page_size: 15, search: search, role: role });
        if (!res.items || res.items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="table-empty-state">No users found.</td></tr>';
          components.renderPagination('pagination-container', 1, 1, 'loadUsers');
          return;
        }

        tbody.innerHTML = res.items.map(u => `
          <tr>
            <td><strong>${u.username}</strong></td>
            <td>${u.full_name}</td>
            <td>${u.email}</td>
            <td><span class="badge bg-secondary">${u.role}</span></td>
            <td>${utils.getStatusBadge(u.is_active ? 'active' : 'inactive')}</td>
            <td>${utils.formatDate(u.created_at)}</td>
            <td>
              <div class="table-actions">
                <button class="table-action-btn" onclick="toggleUser(${u.id})">${u.is_active ? 'Disable' : 'Enable'}</button>
                <button class="table-action-btn text-danger" onclick="deleteUser(${u.id})">🗑️</button>
              </div>
            </td>
          </tr>
        `).join('');

        components.renderPagination('pagination-container', res.page, res.total_pages, 'loadUsers');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">${e.message}</td></tr>`;
      }
    }

    async function createUser(e) {
      e.preventDefault();
      const form = document.getElementById('add-user-form');
      const payload = {
        username: form.username.value.trim(),
        full_name: form.full_name.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        role: form.role.value,
        phone: form.phone.value.trim() || null
      };

      try {
        await api.post('/users', payload);
        utils.showToast('User created successfully!', 'success');
        form.reset();
        bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
        loadUsers(1);
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    async function toggleUser(id) {
      try {
        await api.patch(`/users/${id}/toggle-status`, {});
        utils.showToast('User status updated', 'success');
        loadUsers(curPage);
      } catch (e) {
        utils.showToast(e.message, 'danger');
      }
    }

    async function deleteUser(id) {
      if (!confirm('Are you sure you want to permanently delete this user?')) return;
      try {
        await api.delete(`/users/${id}`);
        utils.showToast('User deleted', 'success');
        loadUsers(curPage);
      } catch (e) {
        utils.showToast(e.message, 'danger');
      }
    }
  </script>
</body>
</html>
