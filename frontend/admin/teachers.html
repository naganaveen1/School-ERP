<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers Directory - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Faculty &amp; Teachers</h2>
            <div class="page-subtitle">Manage teaching staff, departmental assignments, and faculty records</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTeacherModal">
              + Add Faculty Member
            </button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-6">
              <input type="text" id="teacher-search" class="form-control" placeholder="Search by name, employee ID, or email...">
            </div>
            <div class="col-md-4">
              <select id="filter-dept" class="form-select">
                <option value="">All Departments</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="teachersManager.loadTeachers(1)">Refresh</button>
            </div>
          </div>
        </div>

        <!-- Teachers Table -->
        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Emp ID</th>
                <th>Faculty Name</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Qualification</th>
                <th>Contact</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="teachers-table-body">
              <tr><td colspan="7" class="text-center py-4 text-muted">Loading teachers...</td></tr>
            </tbody>
          </table>
        </div>

        <div id="pagination-container" class="mt-3"></div>

        <!-- Add Teacher Modal -->
        <div class="modal fade" id="addTeacherModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <form id="add-teacher-form" onsubmit="teachersManager.createTeacher(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Register Faculty Member</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Full Name *</label>
                      <input type="text" name="full_name" class="form-control" required placeholder="e.g. Dr. Robert Vance">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Email Address *</label>
                      <input type="email" name="email" class="form-control" required placeholder="e.g. rvance@school.edu">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Username *</label>
                      <input type="text" name="username" class="form-control" required placeholder="e.g. prof_vance">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Password *</label>
                      <input type="password" name="password" class="form-control" required minlength="6" placeholder="Min 6 characters">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Employee ID *</label>
                      <input type="text" name="employee_id" class="form-control" required placeholder="e.g. EMP-101">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Department</label>
                      <select name="department_id" id="modal-teacher-dept" class="form-select">
                        <option value="">Select Department</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Designation</label>
                      <input type="text" name="designation" class="form-control" placeholder="e.g. Senior Lecturer" value="Teacher">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Qualification</label>
                      <input type="text" name="qualification" class="form-control" placeholder="e.g. M.Sc, Ph.D. in Physics">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Contact Phone</label>
                      <input type="text" name="phone" class="form-control" placeholder="+1-555-0188">
                    </div>
                    <div class="col-12">
                      <label class="form-label">Residential Address</label>
                      <textarea name="address" class="form-control" rows="2" placeholder="Full residential address..."></textarea>
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Create Faculty Account</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script src="/frontend/js/teachers.js"></script>
  <script>
    if (permissions.enforcePageAccess(['SCHOOL_ADMIN'])) {
      components.renderLayout('Teachers Management');
      teachersManager.init();
    }
  </script>
</body>
</html>
