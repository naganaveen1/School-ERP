<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parents &amp; Guardians - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Parents &amp; Guardians</h2>
            <div class="page-subtitle">Manage registered parents and child guardianship links</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addParentModal">
              + Register Parent
            </button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-10">
              <input type="text" id="parent-search" class="form-control" placeholder="Search by name, email, or username...">
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="loadParents(1)">Refresh</button>
            </div>
          </div>
        </div>

        <!-- Parents Table -->
        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Guardian Name</th>
                <th>Relationship</th>
                <th>Contact Email</th>
                <th>Phone</th>
                <th>Occupation</th>
                <th>Linked Children</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="parents-table-body">
              <tr><td colspan="7" class="text-center py-4 text-muted">Loading parents...</td></tr>
            </tbody>
          </table>
        </div>

        <div id="pagination-container" class="mt-3"></div>

        <!-- Register Parent Modal -->
        <div class="modal fade" id="addParentModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <form id="add-parent-form" onsubmit="createParent(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Register Parent / Guardian</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Full Name *</label>
                      <input type="text" name="full_name" class="form-control" required placeholder="e.g. Eleanor Davis">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Email Address *</label>
                      <input type="email" name="email" class="form-control" required placeholder="e.g. edavis@example.com">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Username *</label>
                      <input type="text" name="username" class="form-control" required placeholder="e.g. parent_davis">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Password *</label>
                      <input type="password" name="password" class="form-control" required minlength="6" placeholder="Min 6 characters">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Relationship Type</label>
                      <select name="relation_type" class="form-select">
                        <option value="Father">Father</option>
                        <option value="Mother">Mother</option>
                        <option value="Guardian">Guardian</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Occupation</label>
                      <input type="text" name="occupation" class="form-control" placeholder="e.g. Architect">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Contact Phone</label>
                      <input type="text" name="phone" class="form-control" placeholder="+1-555-0177">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Emergency Contact Phone</label>
                      <input type="text" name="emergency_contact" class="form-control" placeholder="+1-555-0190">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Residential Address</label>
                      <input type="text" name="address" class="form-control" placeholder="e.g. 742 Evergreen Terrace">
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Register Parent</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Link Child Modal -->
        <div class="modal fade" id="linkStudentModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="link-student-form" onsubmit="submitLinkStudent(event)">
                <input type="hidden" id="link-parent-id">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Link Student to Guardian</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <p class="small text-muted mb-3" id="link-parent-name"></p>
                  <div class="mb-3">
                    <label class="form-label">Select Student to Link</label>
                    <select id="link-student-select" class="form-select" required>
                      <option value="">Select Student</option>
                    </select>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Link Child</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    let curPage = 1;
    let search = '';
    let allStudents = [];

    if (permissions.enforcePageAccess(['SCHOOL_ADMIN', 'PRINCIPAL'])) {
      components.renderLayout('Parents & Guardians');
      loadParents(1);
      loadAllStudentsForLinking();

      document.getElementById('parent-search').addEventListener('input', utils.debounce(e => {
        search = e.target.value.trim();
        loadParents(1);
      }, 350));
    }

    async function loadAllStudentsForLinking() {
      try {
        const res = await api.get('/students', { page_size: 100 });
        allStudents = res.items || [];
        const sel = document.getElementById('link-student-select');
        if (sel) {
          sel.innerHTML = '<option value="">Select Student</option>' +
            allStudents.map(s => `<option value="${s.id}">${s.user ? s.user.full_name : ''} (${s.admission_number})</option>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadParents(page = 1) {
      curPage = page;
      const tbody = document.getElementById('parents-table-body');
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Loading parents...</td></tr>';
      try {
        const res = await api.get('/parents', { page: curPage, page_size: 15, search: search });
        if (!res.items || res.items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="table-empty-state">No parents found.</td></tr>';
          components.renderPagination('pagination-container', 1, 1, 'loadParents');
          return;
        }

        tbody.innerHTML = res.items.map(p => `
          <tr>
            <td>
              <div class="fw-bold">${p.user ? p.user.full_name : '—'}</div>
              <div class="text-muted small">@${p.user ? p.user.username : ''}</div>
            </td>
            <td><span class="badge bg-secondary">${p.relation_type || 'Guardian'}</span></td>
            <td>${p.user ? p.user.email : '—'}</td>
            <td>${p.user && p.user.phone ? p.user.phone : (p.emergency_contact || '—')}</td>
            <td>${p.occupation || '—'}</td>
            <td>
              ${(p.students && p.students.length > 0)
                ? p.students.map(s => `<span class="badge bg-light text-dark border me-1">${s.name} (${s.admission_number})</span>`).join('')
                : '<span class="text-muted small">None linked</span>'}
            </td>
            <td>
              <div class="table-actions">
                <button class="btn btn-sm btn-outline-primary py-0 px-2" onclick="openLinkModal(${p.id}, '${p.user ? p.user.full_name : ''}')">+ Link Child</button>
                <button class="table-action-btn text-danger ms-1" onclick="deleteParent(${p.id})" title="Delete">🗑️</button>
              </div>
            </td>
          </tr>
        `).join('');

        components.renderPagination('pagination-container', res.page, res.total_pages, 'loadParents');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">${e.message}</td></tr>`;
      }
    }

    async function createParent(e) {
      e.preventDefault();
      const form = document.getElementById('add-parent-form');
      const payload = {
        username: form.username.value.trim(),
        full_name: form.full_name.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        relation_type: form.relation_type.value,
        occupation: form.occupation.value.trim() || null,
        phone: form.phone.value.trim() || null,
        emergency_contact: form.emergency_contact.value.trim() || null,
        address: form.address.value.trim() || null
      };

      try {
        await api.post('/parents', payload);
        utils.showToast('Parent registered successfully!', 'success');
        form.reset();
        bootstrap.Modal.getInstance(document.getElementById('addParentModal')).hide();
        loadParents(1);
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    function openLinkModal(parentId, parentName) {
      document.getElementById('link-parent-id').value = parentId;
      document.getElementById('link-parent-name').textContent = `Linking child to guardian: ${parentName}`;
      const modal = new bootstrap.Modal(document.getElementById('linkStudentModal'));
      modal.show();
    }

    async function submitLinkStudent(e) {
      e.preventDefault();
      const parentId = document.getElementById('link-parent-id').value;
      const studentId = document.getElementById('link-student-select').value;
      if (!parentId || !studentId) return;

      try {
        await api.post(`/parents/${parentId}/link-student/${studentId}`, {});
        utils.showToast('Student successfully linked to guardian!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('linkStudentModal')).hide();
        loadParents(curPage);
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    async function deleteParent(id) {
      if (!confirm('Are you sure you want to delete this parent profile?')) return;
      try {
        await api.delete(`/parents/${id}`);
        utils.showToast('Parent deleted', 'success');
        loadParents(curPage);
      } catch (e) {
        utils.showToast(e.message, 'danger');
      }
    }
  </script>
</body>
</html>
