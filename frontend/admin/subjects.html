<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subjects &amp; Courses - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Curriculum Subjects</h2>
            <div class="page-subtitle">Configure courses, subject codes, and assign specialized faculty</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSubjectModal">
              + New Subject
            </button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-10">
              <select id="filter-class" class="form-select" onchange="loadSubjects()">
                <option value="">All Classes</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="loadSubjects()">Refresh</button>
            </div>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Code</th>
                <th>Subject Name</th>
                <th>Assigned Class</th>
                <th>Teacher</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="subjects-tbody">
              <tr><td colspan="5" class="text-center py-4 text-muted">Loading subjects...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Add Subject Modal -->
        <div class="modal fade" id="addSubjectModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="add-subject-form" onsubmit="createSubject(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Create New Subject</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Subject Name *</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. Organic Chemistry">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Subject Code *</label>
                    <input type="text" name="code" class="form-control" required placeholder="e.g. CHEM-201">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Assigned Class *</label>
                    <select name="class_id" id="modal-subj-class" class="form-select" required>
                      <option value="">Select Class</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Subject Teacher (Optional)</label>
                    <select name="teacher_id" id="modal-subj-teacher" class="form-select">
                      <option value="">Unassigned</option>
                    </select>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Create Subject</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    if (permissions.enforcePageAccess(['SCHOOL_ADMIN'])) {
      components.renderLayout('Subjects');
      initPage();
    }

    async function initPage() {
      await loadFilterOptions();
      await loadSubjects();
    }

    async function loadFilterOptions() {
      try {
        const [classes, teachersRes] = await Promise.all([
          api.get('/classes'),
          api.get('/teachers', { page_size: 100 })
        ]);

        const filterCls = document.getElementById('filter-class');
        const modalCls = document.getElementById('modal-subj-class');
        const modalTchr = document.getElementById('modal-subj-teacher');

        if (filterCls) {
          filterCls.innerHTML = '<option value="">All Classes</option>' +
            classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
        if (modalCls) {
          modalCls.innerHTML = '<option value="">Select Class</option>' +
            classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
        if (modalTchr && teachersRes.items) {
          modalTchr.innerHTML = '<option value="">Unassigned</option>' +
            teachersRes.items.map(t => `<option value="${t.id}">${t.user ? t.user.full_name : ''} (${t.employee_id})</option>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadSubjects() {
      const classId = document.getElementById('filter-class').value;
      const tbody = document.getElementById('subjects-tbody');
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Loading subjects...</td></tr>';

      try {
        const params = {};
        if (classId) params.class_id = classId;
        const subjects = await api.get('/subjects', params);

        if (!subjects || subjects.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="table-empty-state">No subjects found.</td></tr>';
          return;
        }

        tbody.innerHTML = subjects.map(s => `
          <tr>
            <td><span class="badge bg-secondary font-monospace">${s.code}</span></td>
            <td><strong>${s.name}</strong></td>
            <td>${s.class_name || '—'}</td>
            <td>${s.teacher_name || '<span class="text-muted">Unassigned</span>'}</td>
            <td>
              <button class="table-action-btn text-danger" onclick="deleteSubject(${s.id})" title="Delete">🗑️</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger py-4 text-center">${e.message}</td></tr>`;
      }
    }

    async function createSubject(e) {
      e.preventDefault();
      const form = document.getElementById('add-subject-form');
      const payload = {
        name: form.name.value.trim(),
        code: form.code.value.trim(),
        class_id: parseInt(form.class_id.value),
        teacher_id: parseInt(form.teacher_id.value) || null
      };

      try {
        await api.post('/subjects', payload);
        utils.showToast('Subject created successfully!', 'success');
        form.reset();
        bootstrap.Modal.getInstance(document.getElementById('addSubjectModal')).hide();
        loadSubjects();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    async function deleteSubject(id) {
      if (!confirm('Are you sure you want to delete this subject?')) return;
      try {
        await api.delete(`/subjects/${id}`);
        utils.showToast('Subject deleted successfully', 'success');
        loadSubjects();
      } catch (e) {
        utils.showToast(e.message, 'danger');
      }
    }
  </script>
</body>
</html>
