<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Directory - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Students Directory</h2>
            <div class="page-subtitle">View, search, register, and manage enrolled students</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">
              + Register Student
            </button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-6">
              <input type="text" id="student-search" class="form-control" placeholder="Search by name, roll no, or admission number...">
            </div>
            <div class="col-md-4">
              <select id="filter-class" class="form-select">
                <option value="">All Classes</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="studentsManager.loadStudents(1)">Refresh</button>
            </div>
          </div>
        </div>

        <!-- Students Table -->
        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Admission No</th>
                <th>Student Name</th>
                <th>Class &amp; Section</th>
                <th>Roll No</th>
                <th>Gender</th>
                <th>Parent/Guardian</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="students-table-body">
              <tr><td colspan="7" class="text-center py-4 text-muted">Loading students...</td></tr>
            </tbody>
          </table>
        </div>

        <div id="pagination-container" class="mt-3"></div>

        <!-- Register Student Modal -->
        <div class="modal fade" id="addStudentModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <form id="add-student-form" onsubmit="studentsManager.createStudent(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Register New Student</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Full Name *</label>
                      <input type="text" name="full_name" class="form-control" required placeholder="e.g. Alice Smith">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Email Address *</label>
                      <input type="email" name="email" class="form-control" required placeholder="e.g. alice@school.edu">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Username *</label>
                      <input type="text" name="username" class="form-control" required placeholder="e.g. student_alice">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Password *</label>
                      <input type="password" name="password" class="form-control" required minlength="6" placeholder="Min 6 characters">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Admission Number *</label>
                      <input type="text" name="admission_number" class="form-control" required placeholder="e.g. ADM-2025-010">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Roll Number</label>
                      <input type="text" name="roll_number" class="form-control" placeholder="e.g. 101">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Class</label>
                      <select name="class_id" id="modal-student-class" class="form-select">
                        <option value="">Select Class</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Gender</label>
                      <select name="gender" class="form-select">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Date of Birth</label>
                      <input type="date" name="date_of_birth" class="form-control">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Phone</label>
                      <input type="text" name="phone" class="form-control" placeholder="+1-555-0199">
                    </div>
                    <div class="col-12">
                      <label class="form-label">Residential Address</label>
                      <textarea name="address" class="form-control" rows="2" placeholder="Full residential address..."></textarea>
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Register Student</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script src="/frontend/js/students.js"></script>
  <script>
    if (permissions.enforcePageAccess(['SCHOOL_ADMIN'])) {
      components.renderLayout('Students Directory');
      studentsManager.init();
    }
  </script>
</body>
</html>
