<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes &amp; Grades - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Classes &amp; Grades</h2>
            <div class="page-subtitle">Configure institutional classes, academic tiers, and year associations</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addClassModal">
              + New Class
            </button>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Class Name</th>
                <th>Grade Level</th>
                <th>Department</th>
                <th>Academic Year</th>
                <th>Sections</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="classes-tbody">
              <tr><td colspan="6" class="text-center py-4 text-muted">Loading classes...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Add Class Modal -->
        <div class="modal fade" id="addClassModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="add-class-form" onsubmit="createClass(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Create New Class</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Class Name *</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. Grade 10 or B.Tech Year 1">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Grade / Tier Level *</label>
                    <input type="number" name="grade_level" class="form-control" required min="1" max="20" placeholder="e.g. 10">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Department (Optional)</label>
                    <select name="department_id" id="class-dept-select" class="form-select">
                      <option value="">General / None</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Academic Year (Optional)</label>
                    <select name="academic_year_id" id="class-year-select" class="form-select">
                      <option value="">Current Active Session</option>
                    </select>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Create Class</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    if (permissions.enforcePageAccess(['SCHOOL_ADMIN'])) {
      components.renderLayout('Classes & Grades');
      loadClasses();
      loadFormDependencies();
    }

    async function loadFormDependencies() {
      try {
        const [depts, years] = await Promise.all([
          api.get('/departments'),
          api.get('/classes/academic-years')
        ]);
        const deptSel = document.getElementById('class-dept-select');
        const yearSel = document.getElementById('class-year-select');

        if (deptSel && depts) {
          deptSel.innerHTML = '<option value="">General / None</option>' +
            depts.map(d => `<option value="${d.id}">${d.name} (${d.code})</option>`).join('');
        }
        if (yearSel && years) {
          yearSel.innerHTML = '<option value="">None</option>' +
            years.map(y => `<option value="${y.id}" ${y.is_current ? 'selected' : ''}>${y.name} ${y.is_current ? '(Active)' : ''}</option>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadClasses() {
      const tbody = document.getElementById('classes-tbody');
      try {
        const classes = await api.get('/classes');
        if (!classes || classes.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="table-empty-state">No classes created yet.</td></tr>';
          return;
        }

        tbody.innerHTML = classes.map(c => `
          <tr>
            <td><strong>${c.name}</strong></td>
            <td>Grade ${c.grade_level}</td>
            <td>${c.department_name || 'General'}</td>
            <td>${c.academic_year_name || '—'}</td>
            <td>
              <span class="badge bg-secondary me-1">${(c.sections || []).length} Sections</span>
              ${(c.sections || []).map(s => `<span class="badge bg-light text-dark border me-1">${s.name}</span>`).join('')}
            </td>
            <td>
              <button class="table-action-btn text-danger" onclick="deleteClass(${c.id})" title="Delete">🗑️</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-danger py-4 text-center">${e.message}</td></tr>`;
      }
    }

    async function createClass(e) {
      e.preventDefault();
      const form = document.getElementById('add-class-form');
      const payload = {
        name: form.name.value.trim(),
        grade_level: parseInt(form.grade_level.value),
        department_id: parseInt(form.department_id.value) || null,
        academic_year_id: parseInt(form.academic_year_id.value) || null
      };

      try {
        await api.post('/classes', payload);
        utils.showToast('Class created successfully!', 'success');
        form.reset();
        bootstrap.Modal.getInstance(document.getElementById('addClassModal')).hide();
        loadClasses();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    async function deleteClass(id) {
      if (!confirm('Are you sure you want to delete this class? This may delete all associated sections.')) return;
      try {
        await api.delete(`/classes/${id}`);
        utils.showToast('Class deleted', 'success');
        loadClasses();
      } catch (e) {
        utils.showToast(e.message, 'danger');
      }
    }
  </script>
</body>
</html>
