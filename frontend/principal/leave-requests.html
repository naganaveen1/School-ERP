<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff &amp; Student Leave Requests - Principal Portal</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Leave Applications Review</h2>
            <div class="page-subtitle">Approve, reject, and review leave requests from faculty and students</div>
          </div>
          <div>
            <button class="btn btn-outline-secondary" onclick="loadLeaves()">Refresh List</button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-10">
              <select id="filter-leave-status" class="form-select" onchange="loadLeaves()">
                <option value="">All Statuses</option>
                <option value="PENDING" selected>Pending Review</option>
                <option value="APPROVED">Approved</option>
                <option value="REJECTED">Rejected</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100" onclick="loadLeaves()">Filter</button>
            </div>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Applicant</th>
                <th>Role</th>
                <th>Leave Type</th>
                <th>Date Duration</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Remarks</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="leaves-tbody">
              <tr><td colspan="8" class="text-center py-4 text-muted">Loading leave requests...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Review Leave Modal -->
        <div class="modal fade" id="reviewLeaveModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="review-leave-form" onsubmit="submitLeaveReview(event)">
                <input type="hidden" id="review-leave-id">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Review Leave Request</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <p id="review-leave-summary" class="small text-muted mb-3"></p>
                  <div class="mb-3">
                    <label class="form-label">Review Decision *</label>
                    <select name="status" id="review-status" class="form-select" required>
                      <option value="APPROVED">Approve Leave</option>
                      <option value="REJECTED">Reject Leave</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Executive Remarks</label>
                    <textarea name="remarks" id="review-remarks" class="form-control" rows="3" placeholder="Optional comments or instructions..."></textarea>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Submit Decision</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    if (permissions.enforcePageAccess(['PRINCIPAL', 'SCHOOL_ADMIN'])) {
      components.renderLayout('Leave Applications Review');
      loadLeaves();
    }

    async function loadLeaves() {
      const statusFilter = document.getElementById('filter-leave-status').value;
      const tbody = document.getElementById('leaves-tbody');
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">Loading leave requests...</td></tr>';

      try {
        const params = {};
        if (statusFilter) params.status_filter = statusFilter;
        const leaves = await api.get('/leave', params);

        if (!leaves || leaves.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="table-empty-state">No leave requests found for this filter.</td></tr>';
          return;
        }

        tbody.innerHTML = leaves.map(l => `
          <tr>
            <td><strong>${l.applicant_name}</strong></td>
            <td><span class="badge bg-secondary">${l.applicant_role}</span></td>
            <td>${l.leave_type}</td>
            <td>${utils.formatDate(l.start_date)} &rarr; ${utils.formatDate(l.end_date)}</td>
            <td class="small text-secondary" style="max-width:200px;">${l.reason}</td>
            <td>${utils.getStatusBadge(l.status)}</td>
            <td class="small text-muted">${l.remarks || '—'}</td>
            <td>
              ${l.status === 'PENDING' ? `
                <button class="btn btn-sm btn-outline-primary" onclick="openReviewModal(${l.id}, '${l.applicant_name}', '${l.leave_type}')">
                  Review
                </button>
              ` : '<span class="text-muted small">Reviewed</span>'}
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-danger py-4 text-center">${e.message}</td></tr>`;
      }
    }

    function openReviewModal(id, applicantName, leaveType) {
      document.getElementById('review-leave-id').value = id;
      document.getElementById('review-leave-summary').textContent = `Reviewing application for ${applicantName} (${leaveType})`;
      const modal = new bootstrap.Modal(document.getElementById('reviewLeaveModal'));
      modal.show();
    }

    async function submitLeaveReview(e) {
      e.preventDefault();
      const id = document.getElementById('review-leave-id').value;
      const status = document.getElementById('review-status').value;
      const remarks = document.getElementById('review-remarks').value.trim() || null;

      try {
        await api.patch(`/leave/${id}/review`, { status, remarks });
        utils.showToast(`Leave request ${status.toLowerCase()} successfully!`, 'success');
        bootstrap.Modal.getInstance(document.getElementById('reviewLeaveModal')).hide();
        loadLeaves();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
