<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .reset-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    }
  </style>
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="reset-card p-4 p-sm-5">
    <div class="text-center mb-4">
      <div style="font-size: 2.2rem;">🔒</div>
      <h4 class="fw-bold text-dark mt-2 mb-1">Password Assistance</h4>
      <p class="text-secondary small">For local security, contact your School Administrator or use demo credentials.</p>
    </div>

    <div class="alert alert-info py-2 px-3 small">
      <strong>Default Demo Password:</strong><br>
      <code>Password123!</code> for all demo users (admin, principal, teacher, student, parent).
    </div>

    <div class="mt-4 text-center">
      <a href="/frontend/login.html" class="btn btn-outline-primary w-100">&larr; Back to Login</a>
    </div>
  </div>
</body>
</html>
