<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examinations - Teacher Portal</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Term &amp; Semester Examinations</h2>
            <div class="page-subtitle">Schedule class assessments, view scheduled exam dates, and publish finalized results</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createExamModal">
              + Schedule Exam
            </button>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Exam Name</th>
                <th>Type</th>
                <th>Target Class</th>
                <th>Exam Window</th>
                <th>Result Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="exams-table-body">
              <tr><td colspan="6" class="text-center py-4 text-muted">Loading exams...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Schedule Exam Modal -->
        <div class="modal fade" id="createExamModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="create-exam-form" onsubmit="examsManager.createExam(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Schedule Examination</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Exam Title *</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. Mid-Term 1 Assessment">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Exam Type *</label>
                    <select name="exam_type" class="form-select" required>
                      <option value="Unit Test">Unit Test</option>
                      <option value="Mid-Term">Mid-Term</option>
                      <option value="Final">Final / Semester</option>
                      <option value="Practical">Practical Lab</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Target Class (Optional)</label>
                    <select name="class_id" id="modal-exam-class" class="form-select">
                      <option value="">All Classes</option>
                    </select>
                  </div>
                  <div class="row g-2 mb-3">
                    <div class="col-md-6">
                      <label class="form-label">Start Date *</label>
                      <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">End Date *</label>
                      <input type="date" name="end_date" class="form-control" required>
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Schedule Exam</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script src="/frontend/js/exams.js"></script>
  <script>
    if (permissions.enforcePageAccess(['TEACHER', 'SCHOOL_ADMIN'])) {
      components.renderLayout('Exams');
      examsManager.init();
      loadExamClassOptions();
    }

    async function loadExamClassOptions() {
      try {
        const classes = await api.get('/classes');
        const sel = document.getElementById('modal-exam-class');
        if (sel && classes) {
          sel.innerHTML = '<option value="">All Classes</option>' +
            classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
