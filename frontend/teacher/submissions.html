<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Submissions - Teacher Portal</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <div class="mb-1"><a href="/frontend/teacher/assignments.html" class="text-decoration-none small">&larr; Back to Assignments</a></div>
            <h2 class="page-title" id="page-submissions-title">Student Submissions</h2>
            <div class="page-subtitle">Review submitted work, download file attachments, and grade student submissions</div>
          </div>
          <div>
            <button class="btn btn-outline-secondary" onclick="initPage()">Refresh Submissions</button>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>#</th>
                <th>Admission No</th>
                <th>Student Full Name</th>
                <th>Assignment Title</th>
                <th>Submission Time</th>
                <th>Status</th>
                <th>Score</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="submissions-table-body">
              <tr><td colspan="8" class="text-center py-4 text-muted">Loading submissions...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Grade Modal -->
        <div class="modal fade" id="gradeModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="grade-form" onsubmit="assignmentsManager.saveGrade(event)">
                <input type="hidden" id="grade-sub-id">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Evaluate Submission</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Marks Obtained *</label>
                    <input type="number" step="0.5" id="grade-marks" class="form-control" required placeholder="Score (e.g. 85.0)">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Instructor Feedback</label>
                    <textarea id="grade-feedback" class="form-control" rows="3" placeholder="Constructive remarks and feedback..."></textarea>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Save Grade</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script src="/frontend/js/assignments.js"></script>
  <script>
    if (permissions.enforcePageAccess(['TEACHER'])) {
      components.renderLayout('Submissions');
      initPage();
    }

    async function initPage() {
      const params = utils.getQueryParams();
      const assignmentId = params.assignment_id;
      const tbody = document.getElementById('submissions-table-body');
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">Loading submissions...</td></tr>';

      try {
        let subs = [];
        if (assignmentId) {
          subs = await api.get(`/assignments/${assignmentId}/submissions`);
        } else {
          subs = await api.get('/teacher/submissions');
        }

        if (!subs || subs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="table-empty-state">No submissions found.</td></tr>';
          return;
        }

        tbody.innerHTML = subs.map((s, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td><strong>${s.admission_number || '—'}</strong></td>
            <td>${s.student_name || 'Student'}</td>
            <td>${s.assignment_title || 'Assignment'}</td>
            <td>${utils.formatDateTime(s.submission_date)}</td>
            <td>${utils.getStatusBadge(s.status)}</td>
            <td>${s.marks_obtained !== null && s.marks_obtained !== undefined ? `<strong class="text-success">${s.marks_obtained} / ${s.max_marks || 100}</strong>` : '<span class="text-muted">Not Graded</span>'}</td>
            <td>
              <div class="table-actions">
                ${s.file_path ? `<a href="/api/documents/file/${s.file_path}" target="_blank" class="table-action-btn" download>📥 Download</a>` : ''}
                <button class="table-action-btn text-primary" onclick="assignmentsManager.openGradeModal(${s.id}, ${s.marks_obtained || 0}, '${(s.feedback || '').replace(/'/g, "\\'")}')">✍️ Grade</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-danger py-4 text-center">${e.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
