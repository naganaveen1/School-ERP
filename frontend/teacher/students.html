<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Students - Teacher Portal</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">My Enrolled Students</h2>
            <div class="page-subtitle">Roster of students across your assigned teaching grades and class sections</div>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-6">
              <input type="text" id="filter-search" class="form-control" placeholder="Search by student name or roll number...">
            </div>
            <div class="col-md-4">
              <select id="filter-class" class="form-select" onchange="loadStudents()">
                <option value="">All My Classes</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="loadStudents()">Refresh</button>
            </div>
          </div>
        </div>

        <div class="table-custom-wrapper">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Roll No</th>
                <th>Admission No</th>
                <th>Full Name</th>
                <th>Class</th>
                <th>Section</th>
              </tr>
            </thead>
            <tbody id="teacher-students-tbody">
              <tr><td colspan="5" class="text-center py-4 text-muted">Loading students...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    let allStudents = [];

    if (permissions.enforcePageAccess(['TEACHER'])) {
      components.renderLayout('My Students');
      initPage();
    }

    async function initPage() {
      await loadClasses();
      const params = utils.getQueryParams();
      if (params.class_id) {
        document.getElementById('filter-class').value = params.class_id;
      }
      await loadStudents();

      document.getElementById('filter-search').addEventListener('input', utils.debounce(renderStudents, 300));
    }

    async function loadClasses() {
      try {
        const classes = await api.get('/teacher/classes');
        const sel = document.getElementById('filter-class');
        if (sel && classes) {
          sel.innerHTML = '<option value="">All My Classes</option>' +
            classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadStudents() {
      const classId = document.getElementById('filter-class').value;
      const tbody = document.getElementById('teacher-students-tbody');
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Loading students...</td></tr>';

      try {
        const params = {};
        if (classId) params.class_id = classId;
        const students = await api.get('/teacher/students', params);
        allStudents = students || [];
        renderStudents();
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger py-4 text-center">${e.message}</td></tr>`;
      }
    }

    function renderStudents() {
      const search = (document.getElementById('filter-search').value || '').toLowerCase().trim();
      const tbody = document.getElementById('teacher-students-tbody');

      const filtered = allStudents.filter(s => {
        if (!search) return true;
        return (s.full_name && s.full_name.toLowerCase().includes(search)) ||
               (s.admission_number && s.admission_number.toLowerCase().includes(search)) ||
               (s.roll_number && s.roll_number.toLowerCase().includes(search));
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="table-empty-state">No students found matching selection.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(s => `
        <tr>
          <td>${s.roll_number || '—'}</td>
          <td><strong>${s.admission_number}</strong></td>
          <td><span class="fw-bold">${s.full_name}</span></td>
          <td>${s.class_name}</td>
          <td>${s.section_name ? `<span class="badge bg-secondary">${s.section_name}</span>` : '—'}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
