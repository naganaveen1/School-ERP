<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Materials - Teacher Portal</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <script src="/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Course Study Materials</h2>
            <div class="page-subtitle">Upload lecture notes, syllabus reference slides, and curriculum documents</div>
          </div>
          <div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadMaterialModal">
              + Upload Study Material
            </button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2">
            <div class="col-md-5">
              <select id="filter-class" class="form-select" onchange="loadMaterials()">
                <option value="">All Classes</option>
              </select>
            </div>
            <div class="col-md-5">
              <select id="filter-subject" class="form-select" onchange="loadMaterials()">
                <option value="">All Subjects</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="loadMaterials()">Refresh</button>
            </div>
          </div>
        </div>

        <div class="row g-3" id="materials-container">
          <div class="col-12 text-center py-4 text-muted">Loading study materials...</div>
        </div>

        <!-- Upload Material Modal -->
        <div class="modal fade" id="uploadMaterialModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="upload-material-form" onsubmit="uploadMaterial(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Upload Study Material</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Material Title *</label>
                    <input type="text" name="title" class="form-control" required placeholder="e.g. Unit 3 - Kinetic Theory Lecture Notes">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Target Class *</label>
                    <select name="class_id" id="modal-material-class" class="form-select" required>
                      <option value="">Select Class</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Subject *</label>
                    <select name="subject_id" id="modal-material-subject" class="form-select" required>
                      <option value="">Select Subject</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Brief Description</label>
                    <textarea name="description" class="form-control" rows="2" placeholder="Summary of notes or topics covered..."></textarea>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">File Document (PDF, DOCX, PPT, etc.) *</label>
                    <input type="file" name="file" class="form-control" required>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Upload Document</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script>
    if (permissions.enforcePageAccess(['TEACHER', 'SCHOOL_ADMIN'])) {
      components.renderLayout('Study Materials');
      initPage();
    }

    async function initPage() {
      await loadDropdowns();
      await loadMaterials();
    }

    async function loadDropdowns() {
      try {
        const [classes, subjects] = await Promise.all([
          api.get('/classes'),
          api.get('/subjects')
        ]);

        const fCls = document.getElementById('filter-class');
        const fSub = document.getElementById('filter-subject');
        const mCls = document.getElementById('modal-material-class');
        const mSub = document.getElementById('modal-material-subject');

        if (fCls && classes) {
          fCls.innerHTML = '<option value="">All Classes</option>' +
            classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
        if (mCls && classes) {
          mCls.innerHTML = '<option value="">Select Class</option>' +
            classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
        if (fSub && subjects) {
          fSub.innerHTML = '<option value="">All Subjects</option>' +
            subjects.map(s => `<option value="${s.id}">${s.name} (${s.code})</option>`).join('');
        }
        if (mSub && subjects) {
          mSub.innerHTML = '<option value="">Select Subject</option>' +
            subjects.map(s => `<option value="${s.id}">${s.name} (${s.code})</option>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadMaterials() {
      const classId = document.getElementById('filter-class').value;
      const subjectId = document.getElementById('filter-subject').value;
      const container = document.getElementById('materials-container');
      container.innerHTML = '<div class="col-12 text-center py-4 text-muted">Loading materials...</div>';

      try {
        const params = {};
        if (classId) params.class_id = classId;
        if (subjectId) params.subject_id = subjectId;

        const list = await api.get('/materials', params);
        if (!list || list.length === 0) {
          container.innerHTML = '<div class="col-12 text-center py-5 text-muted">No study materials found.</div>';
          return;
        }

        container.innerHTML = list.map(m => `
          <div class="col-md-6 col-lg-4 mb-3">
            <div class="card card-custom h-100 p-3">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="fw-bold text-dark mb-0">${m.title}</h5>
                <span class="badge bg-secondary font-monospace">${(m.file_type || 'DOC').toUpperCase()}</span>
              </div>
              <p class="text-secondary small mb-3">${m.description || 'No description provided.'}</p>
              <div class="small text-muted mb-3">
                Class: <strong>${m.class_name || '—'}</strong> &bull; Subject: <strong>${m.subject_name || '—'}</strong>
              </div>
              <div class="d-flex justify-content-between align-items-center pt-2 border-top mt-auto">
                <a href="/api/documents/file/${m.file_path}" target="_blank" class="btn btn-sm btn-outline-primary" download>
                  📥 Download
                </a>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteMaterial(${m.id})">Delete</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<div class="col-12 text-danger text-center py-4">${e.message}</div>`;
      }
    }

    async function uploadMaterial(e) {
      e.preventDefault();
      const form = document.getElementById('upload-material-form');
      const formData = new FormData(form);

      try {
        await api.post('/materials', formData);
        utils.showToast('Study material uploaded successfully!', 'success');
        form.reset();
        bootstrap.Modal.getInstance(document.getElementById('uploadMaterialModal')).hide();
        loadMaterials();
      } catch (err) {
        utils.showToast(err.message, 'danger');
      }
    }

    async function deleteMaterial(id) {
      if (!confirm('Are you sure you want to delete this study material?')) return;
      try {
        await api.delete(`/materials/${id}`);
        utils.showToast('Material deleted successfully', 'success');
        loadMaterials();
      } catch (e) {
        utils.showToast(e.message, 'danger');
      }
    }
  </script>
</body>
</html>
